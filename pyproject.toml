[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kayak-travel-recommender"
version = "0.1.0"
description = "Travel destination recommender based on weather data"
authors = [{name = "Samy Saad"}]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "boto3>=1.40.0",
    "pandas>=2.3.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "streamlit>=1.53.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
scraping = [
    # scrapy-playwright 0.0.45 fixes Scrapy 2.14 compatibility (HTTP11DownloadHandler import path)
    # Requires: Python >=3.10, Scrapy >=2.7, Playwright >=1.40
    "scrapy>=2.14.0",
    "scrapy-playwright>=0.0.45",
    "playwright>=1.40.0",
]

[project.urls]
Repository = "https://github.com/tryph0n/kayak"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-vvv", "-m", "not integration"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.ipynb"]
force-exclude = true

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff==0.15.0",
]

[tool.check-readme-links]
allow = ["coordinates.csv"]
